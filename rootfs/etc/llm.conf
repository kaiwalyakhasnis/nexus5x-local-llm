# Defaults for llmd / llm. Override at runtime in /tmp/llm.conf.
THREADS=6        # all cores: qwen2.5-0.5B Q4_K_M tg 10.3 tok/s vs 7.5 (4x A53) and 5.4 (2x A57)
CPUS=            # pin, e.g. CPUS=4,5 (A57 only); empty = let the HMP scheduler place threads
CTX=2048         # context length; the KV cache grows with it
SERVER_ARGS=
